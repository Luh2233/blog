# CI/CD Pipeline — Build & Deploy
#
# Triggers:
#   - Push to main branch → build + deploy to GitHub Pages
#   - Manual trigger (workflow_dispatch) for on-demand deploy
#
# Deployment targets:
#   1. GitHub Pages (default, free)
#   2. Netlify (uncomment below)
#   3. Vercel (uncomment below)

name: Build and Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Sets GITHUB_TOKEN permissions for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://luh2233.github.io' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Alternative: Deploy to Netlify ──────────────────────────
